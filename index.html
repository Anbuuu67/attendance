<!DOCTYPE html>
<html>
<head>
  <title>Workplace Attendance</title>
</head>
<body>
  <h2>Attendance Submission</h2>
  <button onclick="submitAttendance()">Submit Attendance</button>
  <p id="status"></p>

<script>
// Your workplace location
const officeLat = 1.4294415895698067;
const officeLng = 103.75287157484847;

// Simple distance function (Haversine formula)
function distance(lat1, lon1, lat2, lon2) {
  const R = 6371; // Earth radius in km
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(lat1 * Math.PI/180) *
    Math.cos(lat2 * Math.PI/180) *
    Math.sin(dLon/2) * Math.sin(dLon/2);

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

function submitAttendance() {
  document.getElementById("status").innerText = "Checking location...";

  navigator.geolocation.getCurrentPosition((pos) => {
    const userLat = pos.coords.latitude;
    const userLng = pos.coords.longitude;

    const dist = distance(userLat, userLng, officeLat, officeLng);

    if (dist > 0.1) { // > 100m
      document.getElementById("status").innerText =
        "You are NOT at the workplace. Attendance blocked.";
      return;
    }

    // Send data to Google Sheets backend
    fetch("https://script.google.com/macros/s/AKfycbzJC-FuT27eclMKhu6usd5AnPsYCLFBA2718NJW3xGZZcbZ_6DG0onNDlBYBiz2XAdCnw/exec", {
      method: "POST",
      body: JSON.stringify({
        lat: userLat,
        lng: userLng,
        timestamp: new Date().toISOString()
      }),
    });

    document.getElementById("status").innerText =
      "Attendance submitted successfully!";
  });
}
</script>
</body>
</html>
