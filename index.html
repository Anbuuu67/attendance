<!DOCTYPE html>
<html>
<head>
  <title>Workplace Attendance</title>
</head>
<body>
  <h2>Attendance Submission</h2>
  <label>Name: <input type="text" id="name" placeholder="Your name"></label><br><br>
  <button onclick="submitAttendance()">Submit Attendance</button>
  <p id="status"></p>

<script>
// Google Sheet Web App URL (replace with your deployed script URL)
const SHEET_URL = "YOUR_GOOGLE_SCRIPT_URL_HERE";

let officeLat, officeLng;

// Fetch workplace location from Google Sheet
async function getOfficeLocation() {
  try {
    const response = await fetch(SHEET_URL);
    const data = await response.json();
    officeLat = parseFloat(data.officeLat);
    officeLng = parseFloat(data.officeLng);
  } catch (err) {
    document.getElementById("status").innerText = "Error fetching office location.";
    console.error(err);
  }
}

// Distance calculation (Haversine formula)
function distance(lat1, lon1, lat2, lon2) {
  const R = 6371; // km
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a =
    Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(lat1 * Math.PI/180) *
    Math.cos(lat2 * Math.PI/180) *
    Math.sin(dLon/2) * Math.sin(dLon/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

// Submit attendance
async function submitAttendance() {
  const name = document.getElementById("name").value || "";
  document.getElementById("status").innerText = "Checking location...";
  
  await getOfficeLocation();

  if (officeLat === undefined || officeLng === undefined) {
    document.getElementById("status").innerText = "Office location not found.";
    return;
  }

  if (!navigator.geolocation) {
    document.getElementById("status").innerText = "Geolocation not supported by your browser.";
    return;
  }

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const userLat = pos.coords.latitude;
      const userLng = pos.coords.longitude;

      const dist = distance(userLat, userLng, officeLat, officeLng);

      if (dist > 0.1) { // >100m
        document.getElementById("status").innerText =
          "You are NOT at the workplace. Attendance blocked.";
        return;
      }

      // Send attendance to Google Sheet
      fetch(SHEET_URL, {
        method: "POST",
        body: JSON.stringify({
          lat: userLat,
          lng: userLng,
          timestamp: new Date().toISOString(),
          name: name
        }),
      }).then(() => {
        document.getElementById("status").innerText =
          "Attendance submitted successfully!";
      }).catch((err) => {
        document.getElementById("status").innerText = "Error submitting attendance.";
        console.error(err);
      });

    },
    (err) => {
      if (err.code === 1) {
        document.getElementById("status").innerText = "Location access denied. Please enable GPS.";
      } else if (err.code === 2) {
        document.getElementById("status").innerText = "Position unavailable.";
      } else if (err.code === 3) {
        document.getElementById("status").innerText = "Location request timed out.";
      } else {
        document.getElementById("status").innerText = "Error getting location.";
      }
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}
</script>
</body>
</html>
