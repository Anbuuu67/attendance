<!DOCTYPE html>
<html>
<head>
  <title>Workplace Attendance</title>
</head>
<body>
  <h2>Attendance Submission</h2>
  <label>Name: <input type="text" id="name" placeholder="Your name"></label><br><br>
  <button onclick="submitAttendance()">Submit Attendance</button>
  <p id="status"></p>

<script>
// Google Sheet Web App URL
const SHEET_URL = "YOUR_GOOGLE_SCRIPT_URL_HERE";

let officeLat, officeLng;

// Fetch workplace location from Google Sheet
async function getOfficeLocation() {
  const response = await fetch(SHEET_URL);
  const data = await response.json();
  officeLat = parseFloat(data.officeLat);
  officeLng = parseFloat(data.officeLng);
}

// Distance calculation (Haversine formula)
function distance(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a =
    Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(lat1 * Math.PI/180) *
    Math.cos(lat2 * Math.PI/180) *
    Math.sin(dLon/2) * Math.sin(dLon/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

// Submit attendance
async function submitAttendance() {
  const name = document.getElementById("name").value || "";
  document.getElementById("status").innerText = "Checking location...";
  await getOfficeLocation();

  navigator.geolocation.getCurrentPosition((pos) => {
    const userLat = pos.coords.latitude;
    const userLng = pos.coords.longitude;

    const dist = distance(userLat, userLng, officeLat, officeLng);

    if (dist > 0.1) { // >100m
      document.getElementById("status").innerText =
        "You are NOT at the workplace. Attendance blocked.";
      return;
    }

    // Send attendance to Google Sheet
    fetch(SHEET_URL, {
      method: "POST",
      body: JSON.stringify({
        lat: userLat,
        lng: userLng,
        timestamp: new Date().toISOString(),
        name: name
      }),
    });

    document.getElementById("status").innerText =
      "Attendance submitted successfully!";
  }, () => {
    document.getElementById("status").innerText =
      "Location access denied. Please enable GPS.";
  });
}
</script>
</body>
</html>
